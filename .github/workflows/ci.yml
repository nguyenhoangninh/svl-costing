name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check (all modules)
        run: for f in $(find src -name '*.js') test/*.mjs sw.js; do node --check "$f" || exit 1; done
      # v1.14.81 (audit AUD-12): run the whole npm test suite (unit, dashboard, NRV, synthetic STEP 2 → 5, rules,
      # styled export, export form, approvals, notifications, material cost, R6 basis, provision, Vietnamese mode),
      # so CI proves the same list as a local "npm test". Browser / fixture tests stay manual (test:e2e:*).
      - name: Full test suite (npm test)
        run: npm test
      - name: Release / PWA / security contract tests
        run: node test/release-contract.mjs

  # v1.14.87 (audit NEW-01): a whole period in Chromium on synthetic data (no company files): STEP 1 import → CLOSE →
  # journal by customer → dashboard → Bảng tổng hợp hạch toán → REOPEN. Deploy and Rules publish wait for it.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Synthetic period in the browser (STEP 1 → CLOSE → export → REOPEN)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /dev/null 2>&1 &
          sleep 2
          node test/e2e-synthetic.mjs http://127.0.0.1:8765/
          node test/e2e-local-atomic.mjs http://127.0.0.1:8765/

  # Production deploy: main only, after all checks pass (GitHub Pages source = GitHub Actions).
  deploy:
    needs: [checks, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the site (only what the app serves)
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js icon.svg .nojekyll src lib icons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  # Firestore rules (v1.14.42): published from main only, after all checks pass. The Pages deploy above does NOT publish
  # rules. Until the FIREBASE_SA_JSON and OWNER_EMAIL secrets exist, this job only prints a notice and does nothing.
  # The owner email replaces the placeholder in the runner copy only; the repository keeps the placeholder.
  rules:
    needs: [checks, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare rules (owner email from secret, runner copy only)
        env:
          SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          if [ -z "$SA_JSON" ] || [ -z "$OWNER_EMAIL" ]; then
            echo "::notice::Chưa có secret FIREBASE_SA_JSON / OWNER_EMAIL: bỏ qua publish Firestore rules."
            echo "SKIP_RULES=1" >> "$GITHUB_ENV"
            exit 0
          fi
          OWNER=$(printf '%s' "$OWNER_EMAIL" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          if ! [[ "$OWNER" =~ ^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$ ]]; then
            echo "::error::OWNER_EMAIL không đúng định dạng email."; exit 1
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
          sed -i "s/YOUR_EMAIL@gmail.com/$OWNER/" firestore.rules
          if grep -q "YOUR_EMAIL@gmail.com" firestore.rules; then
            echo "::error::Placeholder vẫn còn trong firestore.rules sau khi thay."; exit 1
          fi
      - name: Publish Firestore rules to project svl-costing
        if: env.SKIP_RULES != '1'
        run: npx --yes firebase-tools@15.31.0 deploy --only firestore:rules --project svl-costing --non-interactive
      - name: Remove service account file
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
