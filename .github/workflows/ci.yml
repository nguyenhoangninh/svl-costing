name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check (all modules)
        run: for f in $(find src -name '*.js') test/*.mjs sw.js; do node --check "$f" || exit 1; done
      - name: Synthetic control tests
        run: node test/unit.mjs
      - name: Synthetic end-to-end costing regression (STEP 2 → 5, no company data)
        run: node test/synth.mjs

  # Production deploy: main is published only after every accounting/control check passes.
  deploy:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the site (only what the app serves)
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js icon.svg .nojekyll src lib icons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
