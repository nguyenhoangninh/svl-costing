<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2b36">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://www.gstatic.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://accounts.google.com wss://*.firebaseio.com; img-src 'self' data: blob: https://*.googleusercontent.com; frame-src https://accounts.google.com https://*.firebaseapp.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SVL Costing">
<title>SVL Costing</title>
<meta name="description" content="SVL Costing Master trên web — tính giá thành tháng: import ERP, phân bổ Stock Out, Material WIP.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #e9eeeb; --panel: #ffffff; --panel-2: #f5f8f6; --ink: #1c2b36; --muted: #5b6b73; --rule: #cdd6d1; --rule-2: #e3e9e5;
  --accent: #1f6f5c; --accent-ink: #ffffff; --accent-soft: #dcefe8;
  --pass: #2e7d4f; --pass-bg: #e1f2e7; --review: #9a6412; --review-bg: #fbefd6; --block: #b4402f; --block-bg: #fbe3df;
  --rerun: #5b4f9a; --rerun-bg: #ebe8f7; --info: #3e6191; --info-bg: #e3ebf6; --none: #7d8a90; --none-bg: #eef1f0;
  --T: #3f6cc0; --S: #5d9b3a; --O: #d9702a;
  --radius: 6px; --shadow: 0 1px 0 rgba(28, 43, 54, .06);
  /* v1.14.53: table regions — header band, zebra rows, totals */
  --head-bg: #2b3e48; --head-ink: #eef4f1; --head-rule: #1f2f37; --zebra: #f6f9f7; --row-hover: #e8f3ee; --total-bg: #dcefe8; --total-ink: #17493d;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a1f; --panel: #19242b; --panel-2: #1e2b33; --ink: #e2ebe7; --muted: #93a4ab; --rule: #2f3f48; --rule-2: #26343c;
    --accent: #4fb596; --accent-ink: #0d1a16; --accent-soft: #1d3a32;
    --pass: #6fcf97; --pass-bg: #18352a; --review: #e8b45c; --review-bg: #3a2e17; --block: #f08a78; --block-bg: #40211c;
    --rerun: #b3a8ef; --rerun-bg: #2b2645; --info: #8fb2e6; --info-bg: #1d2c42; --none: #8a989e; --none-bg: #222e35;
    --T: #7fa3e6; --S: #8fcf6a; --O: #f2a066; color-scheme: dark;
    --head-bg: #0e171c; --head-ink: #d3e3dd; --head-rule: #2f3f48; --zebra: #1c2830; --row-hover: #22343c; --total-bg: #1d3a32; --total-ink: #bfe8d6;
  }
}
:root[data-theme="dark"] {
  --bg: #121a1f; --panel: #19242b; --panel-2: #1e2b33; --ink: #e2ebe7; --muted: #93a4ab; --rule: #2f3f48; --rule-2: #26343c;
  --accent: #4fb596; --accent-ink: #0d1a16; --accent-soft: #1d3a32;
  --pass: #6fcf97; --pass-bg: #18352a; --review: #e8b45c; --review-bg: #3a2e17; --block: #f08a78; --block-bg: #40211c;
  --rerun: #b3a8ef; --rerun-bg: #2b2645; --info: #8fb2e6; --info-bg: #1d2c42; --none: #8a989e; --none-bg: #222e35;
  --T: #7fa3e6; --S: #8fcf6a; --O: #f2a066; color-scheme: dark;
    --head-bg: #0e171c; --head-ink: #d3e3dd; --head-rule: #2f3f48; --zebra: #1c2830; --row-hover: #22343c; --total-bg: #1d3a32; --total-ink: #bfe8d6;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
code { font-size: 12.5px; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 268px 1fr; min-height: 100vh; }
header.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--ink); color: #f0f4f2; }
:root[data-theme="dark"] header.top { background: #0c1216; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) header.top { background: #0c1216; } }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-size: 16px; font-weight: 700; letter-spacing: .2px; }
.brand span { color: #a9bbb4; font-size: 13px; }
.top .grow { flex: 1; }
#account { display: flex; gap: 8px; align-items: center; }
.who { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.sync { font-size: 12px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.theme-t { background: none; border: 1px solid #44565f; color: #dfe8e4; border-radius: 6px; padding: 3px 8px; cursor: pointer; font: inherit; font-size: 12px; }
/* v1.14.59: language switch (shows the language you switch TO) */
.lang-t { background: none; border: 1px solid #44565f; color: #dfe8e4; border-radius: 6px; padding: 3px 9px; cursor: pointer; font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .5px; }
.lang-t:hover, .theme-t:hover { border-color: #7f97a3; }
.auth-screen header.top .lang-t { position: absolute; right: calc(60px + env(safe-area-inset-right)); top: calc(14px + env(safe-area-inset-top)); }

#rail { background: var(--panel); border-right: 1px solid var(--rule); padding: 18px 16px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.period-box label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
.period-row { display: flex; gap: 6px; }
.period-row select { flex: 1; font: inherit; font-size: 18px; font-weight: 700; padding: 4px 8px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); color: var(--ink); }

/* the process line — the one memorable element */
.line { position: relative; display: flex; flex-direction: column; }
.line::before { content: ""; position: absolute; left: 17px; top: 18px; bottom: 18px; width: 2px; background: var(--rule); }
.stop { position: relative; display: flex; align-items: center; gap: 12px; padding: 7px 6px; border-radius: var(--radius); text-decoration: none; color: var(--ink); }
.stop:hover { background: var(--panel-2); }
.stop.on { background: var(--accent-soft); }
.stop.later { color: var(--muted); }
.node { position: relative; z-index: 1; flex: none; width: 24px; height: 24px; margin-left: 5px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; border: 2px solid currentColor; background: var(--panel); }
.stop.on .node { box-shadow: 0 0 0 3px var(--accent-soft); }
.node.s-pass { color: var(--pass); background: var(--pass-bg); }
.node.s-review { color: var(--review); background: var(--review-bg); }
.node.s-block { color: var(--block); background: var(--block-bg); }
.node.s-rerun { color: var(--rerun); background: var(--rerun-bg); }
.node.s-info { color: var(--info); background: var(--info-bg); }
.node.s-none { color: var(--none); border-style: dashed; }
.node.s-cc { color: var(--ink); }
.stop-t { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.stop-t b { font-weight: 600; font-size: 13.5px; }
.stop-t small { color: var(--muted); font-size: 11.5px; }
.tools { display: flex; flex-direction: column; border-top: 1px solid var(--rule-2); padding-top: 12px; }
.tools a { padding: 6px 8px; border-radius: var(--radius); color: var(--ink); text-decoration: none; font-size: 13.5px; }
.tools a.on, .tools a:hover { background: var(--panel-2); }
.ver { margin-top: auto; font-size: 11px; color: var(--muted); }

main { min-width: 0; outline: none; }
.page { padding: 24px 28px 64px; max-width: 1480px; }
.ph { display: flex; gap: 24px; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
h1 { font-size: 24px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; letter-spacing: -.2px; }
h2 { font-size: 15px; margin: 26px 0 10px; font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
h2 small { font-weight: 400; color: var(--muted); font-size: 13px; display: inline-flex; gap: 8px; align-items: center; }
.lead { margin: 0; color: var(--muted); max-width: 78ch; }
.ph > div:first-child { flex: 1 1 auto; min-width: 0; }
.ph .lead { max-width: min(1150px, 100%); } /* v1.14.55: page descriptions use the width they have */
.muted { color: var(--muted); font-size: 13px; }
.result, .next { flex: none; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 190px; }
.result span, .next span { font-size: 12px; color: var(--muted); }
.result small { color: var(--muted); font-size: 12px; }
.next { max-width: 460px; }
.next b { font-weight: 600; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; font-size: 13.5px; padding: 7px 14px; border-radius: var(--radius); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.danger { border-color: var(--block); color: var(--block); }
.btn.sm { padding: 3px 10px; font-size: 12.5px; }
.top .btn.ghost { color: #dfe8e4; border-color: #44565f; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
.row.end { justify-content: space-between; }
.spacer, .vt-spacer { flex: 1; }
input, select { font: inherit; color: var(--ink); }
form.inline { display: flex; gap: 10px; align-items: end; }
form.inline input { display: block; padding: 6px 8px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); }
/* v1.14.74: the NRV decision form inside a half-width card (5P) wraps into a 2-column grid instead of overflowing */
.grid2 #f-nrv-decision { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; align-items: end; margin-top: 8px; }
.grid2 #f-nrv-decision label { min-width: 0; }
.grid2 #f-nrv-decision input, .grid2 #f-nrv-decision select { display: block; width: 100%; min-width: 0 !important; box-sizing: border-box; padding: 6px 8px; }
.grid2 #f-nrv-decision .btn { justify-self: start; }
.grid2 details.nrv-change > summary { cursor: pointer; font-weight: 600; margin: 6px 0; }

.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; line-height: 1.6; }
.s-pass { color: var(--pass); background: var(--pass-bg); }
.s-review { color: var(--review); background: var(--review-bg); }
.s-block { color: var(--block); background: var(--block-bg); }
.s-rerun { color: var(--rerun); background: var(--rerun-bg); }
.s-info { color: var(--info); background: var(--info-bg); }
.s-none { color: var(--none); background: var(--none-bg); }
.erp { display: inline-grid; place-items: center; width: 22px; height: 20px; border-radius: 4px; color: #fff; font-weight: 700; font-size: 11.5px; }
.erp-T { background: var(--T); } .erp-S { background: var(--S); } .erp-O { background: var(--O); }
.err { color: var(--block); font-size: 12px; margin-top: 2px; }

.card { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px 18px; }
.card h2:first-child { margin-top: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(520px, 1fr)); gap: 20px; }
.s2-stack { display: flex; flex-direction: column; gap: 8px; }
.s2-block { min-width: 0; }
table.s2-rec th, table.s2-rec td { white-space: nowrap; padding-left: 8px; padding-right: 8px; }
table.s2-rec td.r, table.s2-cls td.r { font-variant-numeric: tabular-nums; }
/* v1.14.52: allocation-by-system columns — equal widths, badges right-aligned over the numbers, group header underlined, zero muted */
table.s2-rec th.r, table.s2-rec td.r { text-align: right; }
table.s2-rec th.grp { text-align: center; border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
table.s2-rec .sys-col { min-width: 150px; width: 150px; }
table.s2-rec th.sys-col .erp { margin-left: auto; }
table.s2-rec td.sys-col.zero { color: var(--muted); }
table.s2-rec th.sys-col, table.s2-rec td.sys-col { border-left: 1px solid var(--rule-2); }
table.s2-rec tr.tot td { font-weight: 700; border-top: 2px solid var(--rule); }
table.s2-cls { width: 100%; }
table.s2-cls td:nth-child(1) { width: 32%; } table.s2-cls td:nth-child(3) { width: 22%; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0; }
.sys { background: var(--panel); border: 1px solid var(--rule); border-left: 4px solid var(--T); border-radius: var(--radius); padding: 10px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.sys-S { border-left-color: var(--S); } .sys-O { border-left-color: var(--O); }
.sys span, .sys small { color: var(--muted); font-size: 12.5px; grid-column: 1 / -1; }

.kpis.wide { grid-template-columns: repeat(auto-fit, minmax(235px, 1fr)); } /* v1.14.27: 12-digit VND values */
@media (max-width: 900px) { .kpis.wide { grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px) { .kpis.wide { grid-template-columns: 1fr; } }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; margin: 14px 0; }
.kpi { background: var(--panel); padding: 12px 14px; display: flex; flex-direction: column; box-shadow: 1px 0 0 var(--rule), 0 1px 0 var(--rule); }
.kpi span { font-size: 12px; color: var(--muted); }
.kpi b { font-size: clamp(15px, 1.35vw, 19px); font-weight: 600; letter-spacing: -.2px; white-space: nowrap; }
.kpi small { font-size: 11px; color: var(--muted); }
.kpi.strong b { color: var(--accent); }

.flow { display: flex; align-items: stretch; gap: 6px; flex-wrap: wrap; margin: 16px 0; }
.flow i { align-self: center; font-style: normal; font-size: 18px; color: var(--muted); font-weight: 600; }
.fb { flex: 1 1 120px; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); padding: 8px 12px; display: flex; flex-direction: column; min-width: 120px; }
.fb span { font-size: 12px; color: var(--muted); }
.fb b { font-weight: 600; }
.fb.strong { border-color: var(--accent); background: var(--accent-soft); }

table.cp { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); font-size: 13px; }
table.cp th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 7px 10px; border-bottom: 1px solid var(--rule); background: var(--panel-2); }
table.cp td { padding: 6px 10px; border-bottom: 1px solid var(--rule-2); vertical-align: top; }
table.cp tr:last-child td { border-bottom: 0; }
table.cp tr.tot td { font-weight: 600; border-top: 1px solid var(--rule); }
table.cp tr.later td { color: var(--muted); }
.r { text-align: right; }
.cp-no { display: inline-block; min-width: 22px; color: var(--muted); font-size: 12px; }
details { margin: 14px 0; }
summary { cursor: pointer; font-weight: 600; }

.drop { border: 2px dashed var(--rule); background: var(--panel); border-radius: var(--radius); padding: 22px; text-align: center; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop .row { justify-content: center; }
.alert { border-radius: var(--radius); padding: 10px 14px; margin: 12px 0; border: 1px solid; }
.alert.block { color: var(--block); background: var(--block-bg); border-color: currentColor; }
.alert.pass { color: var(--pass); background: var(--pass-bg); border-color: currentColor; }
.alert.review { color: var(--review); background: var(--review-bg); border-color: currentColor; }
/* v1.14.28: STEP 1 abnormal-data cards – A info (blue), B review (amber), C block (red) */
.dq-cards { display: grid; gap: 12px; margin: 12px 0; min-width: 0; }
.dq-cards > * { min-width: 0; max-width: 100%; }
.dq-card { border: 1px solid; border-left-width: 6px; border-radius: var(--radius); padding: 10px 14px; background: var(--surface, transparent); overflow-x: auto; }
.dq-card h3 { margin: 0 0 6px; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dq-card.dq-info { border-color: var(--info); border-left-color: var(--info); background: var(--info-bg); }
.dq-card.dq-info h3 { color: var(--info); }
.dq-card.dq-warn { border-color: var(--review); border-left-color: var(--review); background: var(--review-bg); }
.dq-card.dq-warn h3 { color: var(--review); }
.dq-card.dq-block { border-color: var(--block); border-left-color: var(--block); background: var(--block-bg); }
.dq-card.dq-block h3 { color: var(--block); }
.dq-card .muted { color: inherit; opacity: .85; }
.dq-card .dq-sub { margin: 12px 0 4px; font-size: 14px; }
/* v1.14.30: per-part confirmation bar inside each card + chips in the banner */
.dq-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 8px 0; padding: 8px 10px; border: 1px dashed currentColor; border-radius: var(--radius); background: var(--panel); }
.dq-info-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.dq-bar .row { display: flex; gap: 6px; flex-wrap: wrap; }
.dq-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 0; }
.dq-chip { font-size: 12px; font-weight: 600; border-radius: 4px; padding: 2px 8px; border: 1px solid currentColor; }
.dq-chip.s-pass { color: var(--pass); background: var(--pass-bg); }
.dq-chip.s-block { color: var(--block); background: var(--block-bg); }
/* v1.14.32: khối tiêu hao (STEP 2 NVL, STEP 2B FG): thống kê, bộ lọc, dòng đã chọn được tô màu, tiêu đề cố định khi cuộn */
.cons-card { margin: 14px 0 20px; }
.cons-card > h2 { margin: 0 0 6px; }
.cons-card > p.muted { margin: 0 0 10px; max-width: 980px; line-height: 1.5; }
.cons-wrap-stats { margin: 6px 0 12px; overflow-x: auto; }
.cons-stats { margin: 0; }
.cons-stats td:first-child { font-weight: 600; }
.cons-stats tr.tot td { font-weight: 700; border-top: 2px solid var(--rule); background: var(--panel-2); }
.cons-pick { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); padding: 8px 12px; }
.cons-pick > summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.cons-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; margin: 10px 0; }
.cons-bar label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.cons-bar .grow { flex: 1 1 260px; }
.cons-bar input, .cons-bar select { font: inherit; font-size: 13px; padding: 6px 9px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); color: var(--ink); min-width: 0; }
.cons-bar input[type=search], .cons-bar input[type=text] { width: 100%; }
.cons-bar .cfg-reason-in { width: 100%; }
.cons-vis { font-size: 12.5px; padding-bottom: 7px; }
.cons-wrap { max-height: 440px; overflow: auto; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); }
.cons-wrap > table { margin: 0; border: 0; }
.cons-wrap thead th { position: sticky; top: 0; z-index: 2; background: var(--panel-2); box-shadow: inset 0 -1px 0 var(--rule); }
.cons-wrap tbody td { vertical-align: middle; }
.cons-wrap tbody tr.is-cons td { background: var(--accent-soft); }
.cons-wrap tbody tr.is-cons td:first-child { box-shadow: inset 4px 0 0 var(--accent); }
.cons-wrap tbody tr.is-done td { background: var(--pass-bg); }
.cons-wrap tbody tr:not(.is-cons):not(.is-done):hover td { background: var(--panel-2); }
.cons-wrap td.c, .cons-wrap th.c { text-align: center; width: 70px; }
.cons-wrap input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
